<div class="card mb-3">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Interactive Shell</span>
        <span class="d-flex align-items-center">
            <span class="small mr-2 me-2 gdb-sync-msg"></span>
            <button type="button" class="btn btn-primary btn-sm mr-2 me-2 gdb-sync-btn">Sync</button>
            <span class="badge bg-secondary gdb-status">Connecting...</span>
        </span>
    </div>
    <div class="card-body bg-black p-2" style="overflow: hidden;">
        <div class="gdb-terminal-box" data-config="__GDB_CONFIG__" style="width: 100%; height: 360px; overflow: hidden; position: relative;"></div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

<script>
    (function() {
        const BACKEND = 'localhost:5001';  // matches your local port mapping

        const containers = document.querySelectorAll('.gdb-terminal-box:not(.initialized)');
        if (containers.length === 0) return;
        const container = containers[containers.length - 1];
        container.classList.add('initialized');

        const card = container.closest('.card');
        const statusEl = card.querySelector('.gdb-status');
        const syncBtn = card.querySelector('.gdb-sync-btn');
        const syncMsg = card.querySelector('.gdb-sync-msg');

        const term = new Terminal({
            cursorBlink: true,
            rows: 20,
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme: { background: '#000000', foreground: '#00ff00' }
        });
        term.open(container);

        // ---- read the current egg.py text from the PL file editor ----
        function getEditorCode() {
            const aceEl = document.querySelector('.ace_editor');
            if (window.ace && aceEl) {
                return ace.edit(aceEl).getValue();
            }
            // fallback: PL stores the file base64-encoded in a hidden input
            const hidden = document.querySelector('input[name^="_file_editor"]');
            if (hidden && hidden.value) {
                try { return atob(hidden.value); } catch (e) { /* fall through */ }
            }
            return null;
        }

        // ---- Shared Sync Function (egg.py -> /sync) ----
        async function performSync(silent = false) {
            const code = getEditorCode();
            if (code === null) {
                if (!silent) syncMsg.textContent = 'Could not read the editor contents.';
                return;
            }
            if (!silent) {
                syncBtn.disabled = true;
                syncMsg.textContent = 'Syncing...';
            }
            try {
                const res = await fetch('http://' + BACKEND + '/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const body = await res.json();
                if (!silent) {
                    syncMsg.textContent = body.ok
                        ? 'Synced egg.py (' + body.bytes + ' bytes) to the container.'
                        : 'Sync failed: ' + (body.error || res.status);
                }
            } catch (err) {
                if (!silent) syncMsg.textContent = 'Sync failed: backend unreachable.';
            } finally {
                if (!silent) syncBtn.disabled = false;
            }
        }

        const config = JSON.parse(container.dataset.config);

        // ---- Compile the question's vuln.c before the terminal connects ----
        async function compileChallenge() {
            statusEl.textContent = 'Compiling...';
            try {
                const res = await fetch('http://' + BACKEND + '/sync-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: config.source })
                });
                const body = await res.json();
                if (!body.ok) {
                    statusEl.textContent = 'Compile error';
                    term.writeln('Challenge failed to compile:\r\n' + (body.error || res.status));
                    return false;
                }
                return true;
            } catch (err) {
                statusEl.textContent = 'Disconnected';
                term.writeln('Could not reach backend at ' + BACKEND + ' to compile the challenge.');
                return false;
            }
        }

        // ---- terminal <-> backend shell (only after a successful compile) ----
        compileChallenge().then((ok) => {
            if (!ok) return;

            // Don't put the full source into the websocket URL query string -
            // only aslr/canary/nx are meaningful to /term.
            const { source, ...wsConfig } = config;
            const ws = new WebSocket('ws://' + BACKEND + '/term?' + new URLSearchParams(wsConfig));
            ws.onopen = () => {
                statusEl.textContent = 'Container';
                // Automatically push starter code into the container once connected
                setTimeout(() => performSync(true), 500);
            };
            ws.onmessage = (e) => term.write(e.data);
            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                term.writeln('\r\n[disconnected from backend, reload page for new session]');
            };
            ws.onerror = () => {
                term.writeln('Could not reach backend at ' + BACKEND + '. Is the Docker container running?');
            };
            term.onData((d) => { if (ws.readyState === WebSocket.OPEN) ws.send(d); });
        });

        // ---- Sync button click (still just egg.py) ----
        syncBtn.addEventListener('click', () => performSync(false));
    })();
</script>
