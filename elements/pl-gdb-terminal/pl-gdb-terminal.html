<div class="card mb-3">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Interactive Shell</span>
        <span class="d-flex align-items-center">
            <a class="small mr-2 me-2 text-white gdb-fallback" style="display:none" target="_blank" rel="noopener">Open workspace in a new tab</a>
            <span class="small mr-2 me-2 gdb-sync-msg"></span>
            <button type="button" class="btn btn-primary btn-sm mr-2 me-2 gdb-sync-btn">Sync</button>
            <span class="badge bg-secondary gdb-status">Connecting...</span>
        </span>
    </div>
    <div class="card-body bg-black p-2" style="overflow: hidden;">
        <div class="gdb-terminal-box" data-config="__GDB_CONFIG__" style="width: 100%; height: 360px; overflow: hidden; position: relative;"></div>
    </div>
</div>

<link rel="stylesheet" href="__XTERM_CSS__" />
<script src="__XTERM_JS__"></script>

<script>
    (function() {
        const containers = document.querySelectorAll('.gdb-terminal-box:not(.initialized)');
        if (containers.length === 0) return;
        const container = containers[containers.length - 1];
        container.classList.add('initialized');

        const card = container.closest('.card');
        const statusEl = card.querySelector('.gdb-status');
        const syncBtn = card.querySelector('.gdb-sync-btn');
        const syncMsg = card.querySelector('.gdb-sync-msg');
        const fallbackEl = card.querySelector('.gdb-fallback');

        const term = new Terminal({
            cursorBlink: true,
            rows: 20,
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme: { background: '#000000', foreground: '#00ff00' }
        });
        term.open(container);

        const config = JSON.parse(container.dataset.config);

        // The student's own workspace container, proxied by PrairieLearn on this
        // origin (e.g. /pl/workspace/1/container/). Same origin means the login
        // cookie is sent automatically: no CORS, no tokens.
        const BASE = config.base;
        const WS_BASE = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + BASE;
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        // ---- start the workspace inside this page (no second tab) ----
        // PrairieLearn starts a workspace when its page is opened: the page itself sends
        // the start request. Loading that page in an invisible frame starts the
        // container without a browser tab; the frame stays while this page is open.
        const POLL_MS = 1500;
        const MAX_POLLS = 400;  // ~10 minutes: a first start can pull the image
        let wsPath = null;
        try { wsPath = new URL(config.workspaceUrl, location.href).pathname.replace(/\/$/, ''); } catch (e) { /* ignore */ }

        let frame = null;
        let frameLoaded = false;
        let intercepting = false;  // swallow clicks on <pl-workspace>'s link while the frame is in charge
        let fallbackShown = false;
        let reportedProblem = '';

        // Offer the normal way (a new tab) and stop swallowing clicks on the workspace link.
        function showFallback(message) {
            if (fallbackShown) return;
            fallbackShown = true;
            intercepting = false;
            fallbackEl.href = config.workspaceUrl;
            fallbackEl.style.display = 'inline';
            if (message) term.writeln('\r\n' + message);
        }

        if (config.autostart && wsPath) {
            frame = document.createElement('iframe');
            frame.title = 'workspace launcher';
            frame.setAttribute('aria-hidden', 'true');
            frame.setAttribute('tabindex', '-1');
            // Off-screen and 1px rather than display:none, which some pages mishandle.
            frame.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;' +
                                  'border:0;opacity:0;pointer-events:none;';
            frame.addEventListener('load', () => { frameLoaded = true; });
            frame.src = config.workspaceUrl;
            card.appendChild(frame);

            intercepting = true;
            document.addEventListener('click', (e) => {
                if (!intercepting) return;
                const a = e.target.closest && e.target.closest('a[href]');
                if (!a || a === fallbackEl) return;
                let p;
                try { p = new URL(a.href, location.href).pathname.replace(/\/$/, ''); } catch (err) { return; }
                if (p === wsPath) {
                    e.preventDefault();
                    e.stopPropagation();
                    syncMsg.textContent = 'Starting your environment in this page...';
                }
            }, true);
        }

        // The frame is same-origin, so it can be inspected. Returns null while all looks
        // fine, otherwise {text, fromPrairieLearn} describing the problem.
        function inspectFrame() {
            if (!frame || !frameLoaded) return null;
            try {
                const loc = frame.contentWindow.location;
                if (loc.pathname.replace(/\/$/, '') !== wsPath) {
                    return { text: 'the workspace page redirected to ' + loc.pathname, fromPrairieLearn: false };
                }
                const doc = frame.contentDocument;
                const text = (doc && doc.body && doc.body.innerText) || '';
                const m = text.match(/Error![^\n]*/);
                if (m) return { text: m[0].trim(), fromPrairieLearn: true };
            } catch (e) {
                return { text: 'the browser did not allow the workspace page to load in the background',
                         fromPrairieLearn: false };
            }
            return null;
        }

        // ---- is the container answering? ----
        // Before the workspace is running, the proxy answers with an error or an
        // HTML page, so insist on our own JSON.
        async function backendUp() {
            try {
                const res = await fetch(BASE + 'health', { cache: 'no-store' });
                if (!res.ok) return false;
                const body = await res.json();
                return !!(body && body.ok === true);
            } catch (err) {
                return false;
            }
        }

        // A first start can take minutes (new host, image pull), so wait a long time.
        async function waitForWorkspace() {
            statusEl.textContent = 'Waiting for workspace...';
            if (await backendUp()) return true;
            term.writeln('Your environment is not running yet.');
            term.writeln(config.autostart
                ? 'Starting it in the background. The first start can take a few minutes.'
                : 'Click "Open workspace" above to start it. The first start can take a few minutes.');
            term.writeln('This terminal connects by itself once it is ready.');

            const delaySeconds = Number.isFinite(Number(config.fallbackSeconds)) ? Number(config.fallbackSeconds) : 15;
            const startedAt = Date.now();
            for (let i = 0; i < MAX_POLLS; i++) {
                if (config.autostart && !fallbackShown && delaySeconds === 0) {
                    showFallback('You can also open the workspace in a new tab (link above).');
                }
                await sleep(POLL_MS);
                if (await backendUp()) {
                    term.writeln('\r\nWorkspace is up.');
                    fallbackEl.style.display = 'none';
                    return true;
                }
                if (!config.autostart) continue;

                const problem = inspectFrame();
                if (problem && problem.text !== reportedProblem) {
                    reportedProblem = problem.text;
                    showFallback(null);
                    term.writeln('\r\n' + (problem.fromPrairieLearn
                        ? 'PrairieLearn reported: ' + problem.text
                        : 'Could not start your environment in the background: ' + problem.text + '.'));
                    term.writeln('Use "Open workspace in a new tab" above to open the workspace page directly.');
                } else if (!fallbackShown && Date.now() - startedAt >= delaySeconds * 1000) {
                    showFallback('Still starting. If nothing happens, you can open the workspace in a new tab (link above).');
                }
            }
            statusEl.textContent = 'Not running';
            term.writeln('\r\nGave up waiting. Start the workspace, then reload this page.');
            return false;
        }

        // ---- read the current egg.py text from the PL file editor ----
        function getEditorCode() {
            const aceEl = document.querySelector('.ace_editor');
            if (window.ace && aceEl) {
                return ace.edit(aceEl).getValue();
            }
            // fallback: PL stores the file base64-encoded in a hidden input
            const hidden = document.querySelector('input[name^="_file_editor"]');
            if (hidden && hidden.value) {
                try { return atob(hidden.value); } catch (e) { /* fall through */ }
            }
            return null;
        }

        // ---- Shared Sync Function (egg.py -> /sync) ----
        async function performSync(silent = false) {
            const code = getEditorCode();
            if (code === null) {
                if (!silent) syncMsg.textContent = 'Could not read the editor contents.';
                return;
            }
            if (!silent) {
                syncBtn.disabled = true;
                syncMsg.textContent = 'Syncing...';
            }
            try {
                const res = await fetch(BASE + 'sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const body = await res.json();
                if (!silent) {
                    syncMsg.textContent = body.ok
                        ? 'Synced egg.py (' + body.bytes + ' bytes) to your environment.'
                        : 'Sync failed: ' + (body.error || res.status);
                }
            } catch (err) {
                if (!silent) syncMsg.textContent = 'Sync failed: workspace unreachable.';
            } finally {
                if (!silent) syncBtn.disabled = false;
            }
        }

        // ---- Compile the question's vuln.c before the terminal connects ----
        async function compileChallenge() {
            statusEl.textContent = 'Compiling...';
            try {
                const res = await fetch(BASE + 'sync-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: config.source,
                        architecture: String(config.architecture || '64'),
                        aslr: !!config.aslr,
                        canary: !!config.canary,
                        nx: !!config.nx
                    })
                });
                const body = await res.json();
                if (!body.ok) {
                    statusEl.textContent = 'Compile error';
                    term.writeln('Challenge failed to compile:\r\n' + (body.error || res.status));
                    return false;
                }
                return true;
            } catch (err) {
                statusEl.textContent = 'Disconnected';
                term.writeln('Could not reach your workspace to compile the challenge.');
                return false;
            }
        }

        // ---- terminal <-> gdb in the workspace container ----
        function connectTerminal() {
            const ws = new WebSocket(WS_BASE + 'term');
            ws.onopen = () => {
                statusEl.textContent = 'Container';
                // Automatically push starter code into the container once connected
                setTimeout(() => performSync(true), 500);
            };
            ws.onmessage = (e) => term.write(e.data);
            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                term.writeln('\r\n[disconnected from your workspace, reload the page to reconnect]');
            };
            ws.onerror = () => {
                term.writeln('Could not reach your workspace. Is it still running?');
            };
            term.onData((d) => { if (ws.readyState === WebSocket.OPEN) ws.send(d); });
        }

        (async () => {
            if (!(await waitForWorkspace())) return;
            if (!(await compileChallenge())) return;
            connectTerminal();
        })();

        // ---- Sync button click (still just egg.py) ----
        syncBtn.addEventListener('click', () => performSync(false));
    })();
</script>
