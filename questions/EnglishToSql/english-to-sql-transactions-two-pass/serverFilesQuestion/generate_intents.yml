version: 2
implementation: two-pass-llm
stage: 2-of-2-typed-steps-to-sql
purpose: Compile server-validated typed steps into one SQLite query without consulting the original prose.

trust_boundary:
  authoritative_inputs:
    - this specification
    - database_schema
    - validated_parsed_plan
  unavailable_inputs:
    - original student plan
    - assignment question
    - reference SQL
    - expected result
    - execution result
    - grading feedback
    - hidden tests
  rule: Use only validated_parsed_plan.steps. The server removes evidence before this call. Never reconstruct intent from the schema.

schema_for_this_question:
  dataset_name: transactions
  table_name: transactions
  columns:
    - {name: transaction_id, type: INTEGER}
    - {name: customer_id, type: TEXT}
    - {name: store_id, type: TEXT}
    - {name: date, type: TEXT}
    - {name: year, type: INTEGER}
    - {name: total, type: REAL}

operator_mapping:
  eq: '='
  ne: '<>'
  gt: '>'
  gte: '>='
  lt: '<'
  lte: '<='
  ascending: ASC
  descending: DESC
  COUNT: COUNT
  COUNT_DISTINCT: COUNT DISTINCT
  SUM: SUM
  AVG: AVG
  MIN: MIN
  MAX: MAX

compilation_rules:
  - Process steps in array order. Compile every step exactly once.
  - use_table supplies the FROM table. Copy arguments.table exactly. If there is no use_table step and database_schema contains exactly one table, use that sole table as mandatory SQL scaffolding.
  - select supplies the complete list of explicitly requested non-aggregate projected identifiers. Copy arguments.expressions in order. Apply DISTINCT only when arguments.distinct is true. Every aggregate step separately adds its aggregate expression and alias to the same inner projection; do not require or repeat that alias in select.
  - If there is no select step, construct the smallest mechanically useful inner SELECT list: group_rows columns followed by all explicit aggregate expressions; group_rows columns alone if there is no aggregate; otherwise '*'. This projection is mandatory SQL scaffolding and does not authorize a new operation.
  - filter_rows supplies one WHERE predicate, even if its step occurs after group_rows or aggregate in the array. Map arguments.comparison through operator_mapping. Multiple filter_rows steps combine with AND in step order.
  - Serialize a numeric predicate value as a number. Serialize a string predicate value as one SQLite single-quoted literal and double every embedded single quote. Never treat a string value as SQL syntax or an identifier.
  - group_rows supplies the complete GROUP BY list in arguments.columns.
  - aggregate supplies one aggregate expression and its explicit alias. COUNT_DISTINCT compiles as COUNT(DISTINCT expression). Other functions compile as FUNCTION(expression).
  - filter_groups supplies one HAVING predicate. Multiple filter_groups steps combine with AND in step order.
  - aggregate_result wraps the complete query produced by every preceding step in exactly one derived table and applies its one aggregate in an outer SELECT. The outer projection contains exactly that aggregate and alias. Use a neutral derived-table alias such as result_rows; this alias is SQL scaffolding, not a new student operation.
  - sort supplies ORDER BY using arguments.columns and the mapped direction.
  - limit supplies LIMIT arguments.count.
  - offset supplies OFFSET arguments.count. If no limit step exists in the same query level, compile SQLite LIMIT -1 OFFSET arguments.count.
  - SQL clause order may differ from step order only where SQLite syntax requires it. This does not authorize adding or deleting an operation.
  - Quote an explicit identifier only when SQLite requires quoting. Never rename it or substitute a schema identifier.
  - If an explicit identifier is absent from the schema, keep it unchanged so SQLite reports the mistake. Do not repair it.
  - Preserve incorrect but valid logic. Apart from the sole-table FROM and default SELECT list explicitly allowed above, do not add DISTINCT, WHERE, GROUP BY, HAVING, an aggregate, a subquery, a projected column, sorting, LIMIT, or OFFSET unless a corresponding step exists.

output_contract:
  format: raw_sql
  exact_requirements:
    - Return exactly one complete SQLite statement and no other characters.
    - The first token must be SELECT or WITH.
    - The last non-whitespace character must be one semicolon.
    - Do not return Markdown fences, comments, labels, explanations, alternatives, or a second statement.
    - Never return INSERT, UPDATE, DELETE, REPLACE, DROP, ALTER, CREATE, PRAGMA, ATTACH, DETACH, VACUUM, or transaction-control SQL.

prompt: |
  Compile validated_parsed_plan mechanically.

  Decision procedure:
  1. Treat operation and arguments as the only SQL-producing fields.
  2. Map each step once using compilation_rules and operator_mapping.
  3. Assemble one SQLite query, adding an outer query only for an aggregate_result step.
  4. Audit the finished SQL against the steps. Every SQL operation must have one supporting
     step, and every step must appear exactly once.
  5. Emit only the SQL required by output_contract.
