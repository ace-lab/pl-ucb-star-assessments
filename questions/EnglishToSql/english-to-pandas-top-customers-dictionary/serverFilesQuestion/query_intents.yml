# How to turn the normalized student plan into pandas for this question.

goal: Translate only the operations the student actually wrote. Preserve the student's logic and mistakes.

rules:
  - Use recognized_operations as the complete list of allowed pandas operations.
  - Use recognized_modifiers as the complete list of allowed word-based comparisons and sort directions.
  - Unmatched text may name tables, columns, aliases, intermediate results, values, or connect ideas. It may not add an operation or modifier.
  - Copy every table, column, alias, and intermediate-result name the student explicitly gives, even if it is misspelled or unknown.
  - Do not repair a missing year grouping, a ranking by amount instead of count, a global top 10 instead of a per-year top 10, incomplete join keys, or a missing final grouping.
  - Use a source DataFrame only when the student explicitly names it.
  - A named intermediate result may be assigned to a DataFrame variable so that a later step can use it.
  - Never invent a join. A join needs both source names and every matching column stated by the student.
  - Always return best-effort pandas. If an operation cannot be written without guessing, omit only that operation and continue.
  - Statements may be reordered only when pandas execution requires it.

per_group_top_n:
  - If and only if the student explicitly says to perform an order and keep operation separately for each named group, sort by the named group columns and supplied expression, then use groupby on the named group columns followed by head with the supplied count.
  - Do not group by year merely because the question asks about each year; the student's plan must explicitly say the ranking is for each year.
  - Do not use groupby followed by head when the student requests one global ordering and limit.

intermediate_results:
  - A phrase such as "call this result customer_counts" names the output of the preceding step.
  - Assign named intermediate results to pandas DataFrame variables when later steps refer to them.
  - A merge back to raw_df must use only the matching columns the student explicitly names.
  - Do not silently carry original transaction columns through an aggregate; require a later merge if the student needs original transaction rows.

default_columns:
  - A grouped aggregation retains its grouping columns and requested aggregate columns.
  - A final grouped aggregation retains its grouping columns and requested aggregate columns.
  - Otherwise, retain all columns unless the student explicitly selects columns.

output:
  - Return only simple pandas assignment statements and assign the final DataFrame to result.
  - Return no Markdown, comments, labels, explanations, alternatives, imports, function definitions, or plotting code.
