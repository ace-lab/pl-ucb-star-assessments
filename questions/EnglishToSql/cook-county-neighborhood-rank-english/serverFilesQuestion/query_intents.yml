goal: Translate only the operations the student actually wrote. Preserve the student's logic and mistakes.

rules:
  - Use recognized_operations as the complete list of allowed SQL operations.
  - Use recognized_modifiers as the complete list of allowed word-based comparisons and sort directions.
  - Unmatched text may name tables, columns, aliases, expressions, intermediate results, values, or connect ideas. It may not add an operation or modifier.
  - Copy every table, column, alias, expression, and intermediate-result name the student explicitly gives, even if it is misspelled or unknown.
  - Do not repair a missing filter, grouping column, aggregate, group condition, intermediate result, or outer count.
  - Always return best-effort SQL. If a clause cannot be written without guessing, omit only that clause and continue.
  - SQL clauses may be reordered only when SQLite syntax requires it.

intermediate_results:
  - A phrase such as "name result qualifying_classes" names the output of the preceding grouped step.
  - When a later step explicitly counts the rows of a named intermediate result, emit the grouped step as a subquery and count its rows in an outer SELECT.
  - Do not create a subquery unless the student explicitly names an intermediate result and later aggregates that result.

default_select:
  - If a grouped step has no explicit SELECT list, select its grouping columns followed by its requested aggregates.
  - Otherwise, select only the columns or computed values the student explicitly requests.

output:
  - Return exactly one best-effort SQLite SELECT statement, which may contain a subquery, ending in a semicolon.
  - Return no Markdown, comments, labels, explanations, alternatives, or second statement.
  - Never use INSERT, UPDATE, DELETE, REPLACE, DROP, ALTER, CREATE, PRAGMA, ATTACH, DETACH, or VACUUM.
